<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="スマホで話しかけると、LINE社が自社サーバーにWebhookを送る。自社サーバーはslugでお店を、署名で本物かを判断し、200と答える" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
