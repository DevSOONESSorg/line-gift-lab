<svg xmlns="http://www.w3.org/2000/svg" width="990" height="340" viewBox="0 0 990 340" role="img" aria-label="この教材のしくみ：スマホ・LINE社・自社サーバーの3つがやりとりする図" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; fill: #1f2937; font-size: 15px; text-anchor: middle; }
    .t { font-weight: 700; }
    .s { font-size: 13px; fill: #4b5563; }
    .lbl { font-size: 13px; fill: #1f2937; }
    .box { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
    .line { fill: #ecfdf5; stroke: #06c755; stroke-width: 2; }
    .app { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .sub { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; }
    .solid { stroke: #4b5563; stroke-width: 2; fill: none; }
    .dash { stroke: #6b7280; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
  </style>
  <rect width="990" height="340" rx="12" fill="#ffffff"/>

  <!-- スマホ -->
  <rect class="box" x="20" y="30" width="280" height="76" rx="8"/>
  <text class="t" x="160" y="62">スマホ（LINEアプリ）</text>
  <text class="s" x="160" y="86">お客さん・お店のオーナー</text>

  <!-- Manager / Developers -->
  <rect class="sub" x="20" y="226" width="280" height="76" rx="8"/>
  <text class="t" x="160" y="258">Manager / Developers Console</text>
  <text class="s" x="160" y="282">運営スタッフが構築で使う</text>

  <!-- LINE社 -->
  <rect class="line" x="360" y="100" width="230" height="110" rx="8"/>
  <text class="t" x="475" y="136">LINE社</text>
  <text class="s" x="475" y="162">公式アカウント・チャネル</text>
  <text class="s" x="475" y="186">LIFF・リッチメニュー</text>

  <!-- 自社サーバー -->
  <rect class="app" x="740" y="96" width="230" height="118" rx="8"/>
  <text class="t" x="855" y="128">自社サーバー</text>
  <text class="s" x="855" y="152">おくりギフト / Laravel</text>
  <text class="s" x="855" y="176">店舗・商品・注文</text>
  <text class="s" x="855" y="198">お客さん</text>

  <!-- 管理画面 -->
  <rect class="sub" x="740" y="254" width="230" height="64" rx="8"/>
  <text class="t" x="855" y="281">管理画面</text>
  <text class="s" x="855" y="303">運営スタッフが使う</text>

  <!-- 矢印 -->
  <path class="solid" d="M302,74 L358,118" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="solid" d="M592,158 L738,158" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="665" y="148">Webhook</text>
  <text class="lbl" x="665" y="180">Messaging API</text>
  <path class="dash" d="M302,258 L358,200" marker-end="url(#a)"/>
  <path class="dash" d="M855,252 L855,216" marker-end="url(#a)"/>
</svg>
