<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img" aria-label="シークレットとトークンの役割：LINE社からのWebhookにはシークレットで作った署名、自社サーバーからの返信のお願いにはトークンを付ける" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<style>
text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; fill: #1f2937; font-size: 15px; text-anchor: middle; }
.t { font-weight: 700; }
.s { font-size: 13px; fill: #4b5563; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono", monospace; font-size: 13px; fill: #9d174d; }
.lbl { font-size: 13px; fill: #1f2937; }
.box { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
.line { fill: #ecfdf5; stroke: #06c755; stroke-width: 2; }
.app { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
.sub { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; }
.ok { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
.ng { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5; }
.solid { stroke: #4b5563; stroke-width: 2; fill: none; }
.dash { stroke: #6b7280; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
.bg { fill: #ffffff; }
.lblbg { fill: #ffffff; }
</style>
<rect class="bg" width="700" height="300" rx="12"/>
<rect class="line" x="40" y="20" width="180" height="46" rx="8"/>
<text class="t" x="130.0" y="49.0">LINE社</text>
