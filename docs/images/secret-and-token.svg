<text class="t" x="570.0" y="49.0">自社サーバー</text>
<path class="dash" d="M130,66 L130,280"/>
<path class="dash" d="M570,66 L570,280"/>
<path class="solid" d="M132,140 L568,140" marker-end="url(#a)"/>
<rect class="lblbg" x="226.57" y="90" width="246.85999999999999" height="19" rx="3"/>
<text class="lbl" x="350" y="104" style="text-anchor:middle">Webhook ＋ シークレットで作った署名</text>
<rect class="lblbg" x="245.42000000000002" y="108" width="209.16" height="19" rx="3"/>
<text class="lbl" x="350" y="122" style="text-anchor:middle">「本物のLINE社からです」の証明</text>
<path class="solid" d="M568,240 L132,240" marker-end="url(#a)"/>
<rect class="lblbg" x="265.96000000000004" y="190" width="168.07999999999998" height="19" rx="3"/>
<text class="lbl" x="350" y="204" style="text-anchor:middle">返信のお願い ＋ トークン</text>
