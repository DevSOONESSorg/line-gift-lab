# =====================================================
# Dependabot：使っている部品の新しい版が出たら、更新の PR を自動で作る
#   PR ができると CI が走るので、「更新しても教材が壊れないか」まで自動でわかります。
#   ✅ ならマージ、❌ なら中身を見て判断します。
# =====================================================
version: 2
updates:
  # Laravel 本体などの PHP の部品（composer.json / composer.lock）
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # 小さな更新（バグ修正・機能追加）は1つの PR にまとめる
      composer-minor:
        update-types: [minor, patch]

  # Terraform の GitHub 用の部品（infra/github/.terraform.lock.hcl）
  - package-ecosystem: terraform
    directory: /infra/github
    schedule:
      interval: monthly
      timezone: Asia/Tokyo

  # E2E テストの道具（tests/e2e/package.json）
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: monthly
      timezone: Asia/Tokyo

  # CI で使っているアクション（actions/checkout など）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tokyo

  # Dockerfile の土台（php:8.4-cli-bookworm）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    ignore:
      # PHP の 8.4 → 8.5 のような版上げは提案させない（実物のアプリに合わせて、人が決める）。
      # 8.4 の中のセキュリティ修正は、同じ 8.4-cli-bookworm の名前のまま配布されるので、
      # docker compose build --pull で取り込まれる
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
