# 起動:  docker compose up
# 停止:  Ctrl+C のあと docker compose down
#
# コースB（本物のLINEとつなぐ）では、インターネットから届く入口（トンネル）も一緒に起動します:
#        docker compose --profile tunnel up
services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"        # 左がPC側のポート（.env の PORT で変えられる）
    volumes:
      - ./:/app                     # フォルダをまるごと共有。コードを直すとすぐ反映される
      - vendor:/app/vendor          # Laravel 本体など（数千ファイル）はコンテナの中だけに置く（Macの共有だと遅く、失敗しやすい）
    environment:
      - TZ=Asia/Tokyo
      - PORT=${PORT:-3000}
      - APP_INTERNAL_PORT=3000
      - VIEW_COMPILED_PATH=/tmp/lab-views   # 画面の変換結果はコンテナの中に置く（Macと共有するフォルダだと、同時に開いたときに読み込みが間に合わないことがある）

  # インターネット → あなたのPC への一時的な入口（Cloudflare Quick Tunnel）
  # アカウント登録は不要。ただし起動するたびにURLが変わります。
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:3000
    depends_on:
      - app

volumes:
  vendor:
