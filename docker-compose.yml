# 起動:  docker compose up
# 停止:  Ctrl+C のあと docker compose down
#
# コースB（本物のLINEとつなぐ）では、インターネットから届く入口（トンネル）も一緒に起動します:
#        docker compose --profile tunnel up
services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"        # 左がPC側のポート（.envで変更できる）
    volumes:
      - ./src:/app/src              # コードを直すとすぐ反映される
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ./richmenus:/app/richmenus
      - ./data:/app/data            # DBファイルはPC側の data/ に保存される
    environment:
      - TZ=Asia/Tokyo
      - APP_NAME=${APP_NAME:-おくりギフト}
      - HOST_PORT=${PORT:-3000}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_LIFF_ID=${LINE_LIFF_ID:-}
      - TUNNEL_METRICS=http://tunnel:2000

  # インターネット → あなたのPC への一時的な入口（Cloudflare Quick Tunnel）
  # アカウント登録は不要。ただし起動するたびにURLが変わります。
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:3000
    depends_on:
      - app
